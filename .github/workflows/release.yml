name: Release

# Cutting a release is `git tag v0.1.0 && git push origin v0.1.0`. Everything
# below hangs off that one push. The tag is the only input, and it is checked
# against the workspace version before anything leaves the runner, because a
# crates.io upload cannot be taken back — only yanked, which leaves the version
# number burned forever.
on:
  push:
    tags: ["v*"]

# Two pushes of the same tag would race on the same upload. Never cancel a run
# in progress: cancelling between the two `cargo publish` uploads would leave
# mvcc-derive on crates.io without the mvcc-core that refers to it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can say no. Runs before the first upload and gates every
  # other job, so a bad tag or a crate that does not build from its own tarball
  # costs a red run rather than a yanked version.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      # Pinned to the MSRV, matching test.yml: a release is not the place to
      # discover that a newer toolchain has opinions the tree has not seen.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The tag names the version; Cargo.toml is what actually gets published.
      # If they disagree the tag is a lie about what is on crates.io, and no
      # later step can fix that, so stop here.
      - name: Check tag against workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "mvcc-core") | .version')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # Anything with a pre-release segment (v0.2.0-rc.1) lands as a
          # pre-release on GitHub rather than as the latest version.
          case "$tag" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      # What docs.rs will try to build, built here first. docs.rs failing is
      # not fatal to a release, but it is silent — it happens minutes later on
      # someone else's machine — so catch it while a red X still means something.
      - name: Check docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      # The last thing that can fail for free. This packages both crates and
      # builds each one from its own tarball, which is a different build from
      # everything above: it catches a file the manifest forgot to include.
      - name: Dry-run publish
        run: cargo publish --workspace --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # A published version is permanent, so the token lives behind a GitHub
    # environment: protection rules on `crates-io` (required reviewers, tag
    # restrictions) apply to this job and nothing else in the repo.
    environment: crates-io

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"

      # `--workspace` publishes mvcc-derive and mvcc-core in dependency order in
      # one command. Doing it as two invocations would mean waiting for the
      # crates.io index to catch up in between, which is the classic flaky
      # release step; Cargo handles the ordering itself.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # `--generate-notes` diffs against the previous tag, which needs the
          # tags and the commits between them; the default shallow fetch has
          # neither.
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi

          gh release create "$GITHUB_REF_NAME" --title "v$VERSION" "${flags[@]}"

          # The commit list comes from --generate-notes; the links have to be
          # appended afterwards, because gh will not take both a body and a
          # generated one in the same call.
          {
            gh release view "$GITHUB_REF_NAME" --json body -q .body
            printf '\n\n---\n\n'
            printf -- '- [mvcc-core %s on crates.io](https://crates.io/crates/mvcc-core/%s)\n' "$VERSION" "$VERSION"
            printf -- '- [Documentation](https://docs.rs/mvcc-core/%s)\n' "$VERSION"
          } > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  # docs.rs builds on its own once a version lands on crates.io — nothing here
  # triggers it. This job only watches, so that a docs build that fails on
  # their machine shows up as a failed release rather than as a broken link
  # someone reports later.
  docs:
    name: Wait for docs.rs
    needs: [verify, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Poll docs.rs
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          failed=0
          for crate in mvcc-derive mvcc-core; do
            url="https://docs.rs/crate/$crate/$VERSION/status.json"
            echo "::group::$crate"
            settled=0
            # Queue depth varies; 30 tries at 30s is 15 minutes, which is long
            # enough for a normal day and short enough not to hold a runner.
            for _ in $(seq 30); do
              status=$(curl -sf "$url" | jq -r '.doc_status // empty' || true)
              if [ "$status" = "true" ]; then
                echo "built: https://docs.rs/$crate/$VERSION"
                settled=1
                break
              fi
              if [ "$status" = "false" ]; then
                echo "::error::docs.rs build failed for $crate $VERSION — https://docs.rs/crate/$crate/$VERSION/builds"
                settled=1
                failed=1
                break
              fi
              sleep 30
            done
            # Still queued after 15 minutes is not a broken build, so say so
            # without failing the release over it.
            if [ "$settled" = 0 ]; then
              echo "::warning::docs.rs has not built $crate $VERSION yet — https://docs.rs/crate/$crate/$VERSION/builds"
            fi
            echo "::endgroup::"
          done
          exit $failed
