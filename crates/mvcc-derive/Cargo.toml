[package]
name = "mvcc-derive"
description = "#[derive(Mvcc)] for the mvcc-core crate. Not intended to be depended on directly — use `mvcc-core`, which re-exports it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mvcc", "derive", "macro", "database", "transactions"]
categories = ["database-implementations", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }

[lints]
workspace = true
